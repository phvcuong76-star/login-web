<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Game QA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            border: none;
            background: linear-gradient(180deg, #38bdf8 0%, #bae6fd 85%, #4ade80 85%, #166534 100%);
            display: block;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- 👇 Đã thu gọn height của canvas xuống 175px để vừa khít tuyệt đối với iframe -->
    <canvas id="qaMiniGameCanvas" width="260" height="175"></canvas>

    <script>
        const canvas = document.getElementById('qaMiniGameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = 'START'; // START | PLAYING | GAMEOVER
        let score = 0;
        let lives = 3;
        let level = 1;
        let player = { x: 110, y: 138, w: 40, h: 25 };
        let items = [];
        let clouds = [{ x: 20, y: 35 }, { x: 170, y: 50 }];

        // Di chuyển nhân vật theo chuột hoặc chạm màn hình
        canvas.addEventListener('mousemove', (e) => {
            if (gameState !== 'PLAYING') return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            player.x = Math.max(5, Math.min(mouseX - player.w / 2, canvas.width - player.w - 5));
        });

        canvas.addEventListener('touchmove', (e) => {
            if (gameState !== 'PLAYING') return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            player.x = Math.max(5, Math.min(touchX - player.w / 2, canvas.width - player.w - 5));
        }, { passive: false });

        // Bấm START hoặc chơi lại
        canvas.addEventListener('click', () => {
            if (gameState === 'START' || gameState === 'GAMEOVER') {
                score = 0;
                lives = 3;
                level = 1;
                items = [];
                gameState = 'PLAYING';
            }
        });

        function spawnItem() {
            if (Math.random() < 0.03 + level * 0.005) {
                const isBomb = Math.random() < 0.25;
                items.push({
                    x: Math.random() * (canvas.width - 30) + 5,
                    y: -25,
                    size: 20,
                    speed: 2.0 + Math.random() * 1.2 + level * 0.2,
                    type: isBomb ? 'BOMB' : (Math.random() < 0.3 ? 'CHEST' : 'GIFT')
                });
            }
        }

        function drawPixelText(text, x, y, size, fill, stroke = '#000000') {
            ctx.font = `900 ${size}px "Segoe UI", Tahoma, sans-serif`;
            ctx.textAlign = 'center';
            ctx.lineWidth = 3;
            ctx.strokeStyle = stroke;
            ctx.strokeText(text, x, y);
            ctx.fillStyle = fill;
            ctx.fillText(text, x, y);
        }

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Nền trời & thảm cỏ thu gọn
            ctx.fillStyle = '#4da6ff';
            ctx.fillRect(0, 0, canvas.width, 145);
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(0, 145, canvas.width, 8);
            ctx.fillStyle = '#3f6212';
            ctx.fillRect(0, 153, canvas.width, 22);

            // Mây trôi
            ctx.fillStyle = '#ffffff';
            clouds.forEach(c => {
                ctx.fillRect(c.x, c.y, 36, 10);
                ctx.fillRect(c.x + 8, c.y - 6, 20, 8);
                c.x += 0.2;
                if (c.x > canvas.width) c.x = -40;
            });

            // Thanh Lv & Máu trái tim
            drawPixelText(`Lv ${level}`, 30, 20, 13, '#ffffff');
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(170, 11, (lives / 3) * 70, 9);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(170, 11, 70, 9);
            ctx.fillStyle = '#dc2626';
            ctx.font = '13px sans-serif';
            ctx.fillText('❤️', 162, 19);

            if (gameState === 'START') {
                drawPixelText('Thư giãn cùng QA!', canvas.width / 2, 60, 13, '#fde047');
                drawPixelText('Play the Quality', canvas.width / 2, 92, 18, '#facc15');

                // Nút START
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(75, 112, 110, 30);
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000000';
                ctx.strokeRect(75, 112, 110, 30);
                ctx.fillStyle = '#000000';
                ctx.font = '900 14px sans-serif';
                ctx.fillText('START', canvas.width / 2, 132);

                // Trang trí mặt đất
                ctx.font = '20px sans-serif';
                ctx.fillText('👷', 35, 155);
                ctx.fillText('🎁', 90, 155);
                ctx.fillText('⭐', 150, 155);
                ctx.fillText('🧰', 215, 155);
            } else if (gameState === 'PLAYING') {
                drawPixelText(`Điểm: ${score}`, canvas.width / 2, 38, 14, '#ffffff');

                // Nhân vật
                ctx.font = '26px sans-serif';
                ctx.fillText('👷', player.x + player.w / 2, player.y + 22);

                spawnItem();
                for (let i = items.length - 1; i >= 0; i--) {
                    let it = items[i];
                    it.y += it.speed;

                    ctx.font = '20px sans-serif';
                    const icon = it.type === 'BOMB' ? '🐞' : (it.type === 'CHEST' ? '🧰' : '🎁');
                    ctx.fillText(icon, it.x + 10, it.y + 16);

                    if (
                        it.x < player.x + player.w &&
                        it.x + it.size > player.x &&
                        it.y < player.y + player.h &&
                        it.y + it.size > player.y
                    ) {
                        if (it.type === 'BOMB') {
                            lives--;
                            if (lives <= 0) gameState = 'GAMEOVER';
                        } else {
                            score += (it.type === 'CHEST' ? 30 : 10);
                            level = Math.floor(score / 100) + 1;
                        }
                        items.splice(i, 1);
                        continue;
                    }

                    if (it.y > canvas.height) items.splice(i, 1);
                }
            } else if (gameState === 'GAMEOVER') {
                drawPixelText('HẾT LƯỢT!', canvas.width / 2, 75, 22, '#ef4444');
                drawPixelText(`Tổng điểm: ${score}`, canvas.width / 2, 105, 15, '#ffffff');

                ctx.fillStyle = '#fef08a';
                ctx.fillRect(75, 122, 110, 30);
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000000';
                ctx.strokeRect(75, 122, 110, 30);
                ctx.fillStyle = '#000000';
                ctx.font = '900 13px sans-serif';
                ctx.fillText('CHƠI LẠI', canvas.width / 2, 142);
            }

            requestAnimationFrame(drawScene);
        }

        drawScene();
    </script>
</body>
</html>
