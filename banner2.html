<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner Sự Kiện</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: transparent; overflow: hidden; }
        .promo-banner-card {
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            border: 1px solid #bfdbfe;
            border-radius: 16px;
            padding: 14px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .promo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .promo-title {
            font-size: 14px;
            font-weight: 700;
            color: #b45309;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .promo-badge {
            background-color: #2563eb;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 8px;
            text-transform: uppercase;
        }
        .promo-body {
            background: #ffffff;
            border-radius: 10px;
            padding: 10px;
            border: 1px solid #cbd5e1;
            /* 👇 TĂNG ĐỘ CAO KHUNG TRẮNG TẠI ĐÂY */
            flex: 1;                 /* Giúp khung trắng tự động mở rộng chiếm hết phần trống còn lại */
            display: flex;
            flex-direction: column;
            justify-content: center;  /* Căn chữ ra giữa theo chiều dọc của khung trắng */
            margin-top: 10px;          /* Tạo khoảng cách một chút với tiêu đề phía trên */
        }
        .promo-heading {
            font-size: 13px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 4px;
        }
        .promo-desc {
            font-size: 12px;
            color: #475569;
            line-height: 1.3;
        }
    </style>
</head>
<body>
    <div class="promo-banner-card">
        <div class="promo-header">
            <h3 class="promo-title">
                <i class="fas fa-star" style="color: #d97706;"></i> Sự Kiện & Sáng Kiến
            </h3>
            <span class="promo-badge">Hot</span>
        </div>
        <div class="promo-body" style="padding: 0; overflow: hidden;">
    <img src="Standee-Hoi-thao-Quan-ly-2026.jpg" alt="Ảnh quảng cáo"class="ad-banner-img" onclick="window.open(this.src, '_blank')" style="width: 100%; height: 100%; object-fit: contain; border-radius: 10px;">
</div>
    </div>
</body>
</html>
