<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Quy Trình - Bộ Phận Hoàn Thành</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; padding: 40px 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .back-btn { text-decoration: none; color: #1a73e8; background: #e8f0fe; padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 13px; }
        .lang-switch { display: inline-flex; background-color: #e9ecef; padding: 4px; border-radius: 20px; gap: 4px; }
        .lang-btn { border: none; background: transparent; padding: 4px 10px; font-size: 12px; font-weight: 600; color: #6c757d; border-radius: 16px; cursor: pointer; }
        .lang-btn.active { background-color: #1a73e8; color: #ffffff; }
        h2 { text-align: center; color: #1e293b; margin-bottom: 30px; }
        
        .doc-list { display: flex; flex-direction: column; gap: 15px; }
        .doc-item { display: flex; justify-content: space-between; align-items: center; border: 1px solid #e2e8f0; padding: 16px 20px; border-radius: 10px; transition: all 0.2s; }
        .doc-item:hover { border-color: #cbd5e1; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .doc-title { font-weight: 700; color: #1e293b; margin-bottom: 4px; font-size: 15px; }
        .doc-desc { color: #64748b; font-size: 13px; margin: 0; }
        .btn-view { background: #1a73e8; color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; border: none; }
        
        /* 🔒 Mặc định ẨN HẲN nút cập nhật để tránh lộ giao diện chỉnh sửa */
        .btn-update { 
            background: #1a73e8; 
            color: #fff; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 8px; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 25px; 
            float: right; 
            display: none !important; /* Mặc định ẩn */
            align-items: center; 
            gap: 6px; 
        }

        /* Hiển thị nút khi xác nhận tài khoản có quyền Admin / Staff */
        .btn-update.show-admin {
            display: flex !important;
        }

        /* Modal Styles */
        .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #fff; width: 100%; max-width: 700px; border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .edit-row { display: grid; grid-template-columns: 2fr 2fr 2fr 80px 35px; gap: 8px; margin-bottom: 10px; align-items: center; }
        .edit-row input { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; width: 100%; }
        .btn-del { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; border-radius: 6px; height: 32px; cursor: pointer; }
        .btn-pdf { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; padding: 6px; font-size: 11px; cursor: pointer; white-space: nowrap; }
        .btn-add { width: 100%; padding: 8px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 6px; cursor: pointer; font-weight: 600; color: #475569; margin-top: 10px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-save { background: #16a34a; color: #fff; border: none; padding: 8px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-cancel { background: #e2e8f0; color: #475569; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-nav">
            <a href="dashboard.html" class="back-btn">← Quay lại trang chủ</a>
            <div class="lang-switch">
                <button class="lang-btn">KR</button>
                <button class="lang-btn">EN</button>
                <button class="lang-btn active">VN</button>
            </div>
        </div>

        <h2>📦 Danh Sách Quy Trình - Bộ Phận Hoàn Thành</h2>

        <div class="doc-list" id="docListContainer">
            <p>Đang tải dữ liệu...</p>
        </div>

        <!-- Nút Cập nhật (Mặc định ẩn hoàn toàn) -->
        <button class="btn-update" id="btnUpdateList" onclick="openModal()">✏️ Cập nhật Danh sách</button>
        <div style="clear: both;"></div>
    </div>

    <!-- MODAL EDIT -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <h3 style="margin-top:0;">✏️ Cập Nhật Danh Sách Tài Liệu Hoàn Thành</h3>
            <div id="modalRowContainer"></div>
            <button class="btn-add" onclick="addModalRow()">+ Thêm tài liệu mới</button>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeModal()">Hủy</button>
                <button class="btn-save" id="btnSave" onclick="saveData()">Lưu thay đổi</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxz-KILTv4mVPUg9fWHRD5nn44Bug0YPHr3_zijSyWvfZlGuQxW4GLhKQ8Kf4jTLfLT/exec';
        const SHEET_NAME = 'finishing_docs';

        let currentFinishingList = [];

        // 🔒 HÀM KIỂM TRA QUYỀN SỬA
        function checkCanEdit() {
            try {
                // Đọc thông tin phân quyền từ bộ nhớ trình duyệt
                const storageData = {
                    role: localStorage.getItem('role') || sessionStorage.getItem('role'),
                    userRole: localStorage.getItem('userRole') || sessionStorage.getItem('userRole'),
                    user: JSON.parse(localStorage.getItem('currentUser') || sessionStorage.getItem('currentUser') || '{}'),
                    account: JSON.parse(localStorage.getItem('user') || sessionStorage.getItem('user') || '{}')
                };

                const roleStr = (
                    storageData.role || 
                    storageData.userRole || 
                    storageData.user.role || 
                    storageData.user.type ||
                    storageData.account.role || 
                    ''
                ).toString().toLowerCase();

                // Xác minh vai trò hợp lệ được quyền cập nhật
                if (roleStr.includes('admin') || roleStr.includes('manager') || roleStr.includes('editor') || roleStr.includes('staff')) {
                    return true;
                }
            } catch (e) {
                console.warn('Lỗi kiểm tra quyền:', e);
            }
            return false;
        }

        // Cập nhật hiển thị giao diện theo quyền
        function applyPermissionUI() {
            const btnUpdate = document.getElementById('btnUpdateList');
            if (btnUpdate) {
                if (checkCanEdit()) {
                    btnUpdate.classList.add('show-admin');
                } else {
                    btnUpdate.classList.remove('show-admin');
                }
            }
        }

        function openDocument(url) {
            if (!url || url === '#') return;
            
            if (url.startsWith('data:application/pdf')) {
                try {
                    const arr = url.split(',');
                    const mime = arr[0].match(/:(.*?);/)[1];
                    const bstr = atob(arr[1]);
                    let n = bstr.length;
                    const u8arr = new Uint8Array(n);
                    while (n--) {
                        u8arr[n] = bstr.charCodeAt(n);
                    }
                    const blob = new Blob([u8arr], { type: mime });
                    const blobUrl = URL.createObjectURL(blob);
                    window.open(blobUrl, '_blank');
                } catch (e) {
                    alert("Không thể mở file PDF! Vui lòng thử lại.");
                }
            } else {
                window.open(url, '_blank');
            }
        }

        async function loadFinishingDocsData() {
            const container = document.getElementById('docListContainer');
            if (container) container.innerHTML = '<p>Đang tải dữ liệu từ Google Sheets...</p>';

            try {
                const res = await fetch(SCRIPT_URL);
                const result = await res.json();
                
                currentFinishingList = result[SHEET_NAME] || [];
                renderList(currentFinishingList);
            } catch (err) {
                console.error('Lỗi khi tải dữ liệu:', err);
                if (container) container.innerHTML = '<p style="color: red;">Không thể tải dữ liệu. Vui lòng kiểm tra lại cấu hình SCRIPT_URL!</p>';
            }
        }

        function renderList(list) {
            const container = document.getElementById('docListContainer');
            container.innerHTML = '';

            if (!list || list.length === 0) {
                container.innerHTML = '<p>Chưa có tài liệu nào trong danh sách.</p>';
                return;
            }

            list.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'doc-item';
                
                const safeLink = (item.link || '#').replace(/'/g, "\\'");
                
                itemDiv.innerHTML = `
                    <div>
                        <div class="doc-title">${item.title || 'Chưa có tiêu đề'}</div>
                        <div class="doc-desc">${item.lang || item.desc || ''}</div>
                    </div>
                    <button class="btn-view" onclick="openDocument('${safeLink}')">Mở tài liệu ↗</button>
                `;
                container.appendChild(itemDiv);
            });
        }

        function openModal() {
            if (!checkCanEdit()) {
                alert("Tài khoản của bạn không có quyền cập nhật danh sách!");
                return;
            }

            const container = document.getElementById('modalRowContainer');
            container.innerHTML = '';
            
            if (currentFinishingList.length === 0) {
                addModalRow();
            } else {
                currentFinishingList.forEach(item => addModalRow(item.title, item.lang || item.desc, item.link));
            }
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function addModalRow(title = '', desc = '', link = '') {
            const container = document.getElementById('modalRowContainer');
            const row = document.createElement('div');
            row.className = 'edit-row';
            row.innerHTML = `
                <input type="text" placeholder="Tên quy trình" value="${title}">
                <input type="text" placeholder="Ngôn ngữ / Mô tả" value="${desc}">
                <input type="text" class="link-input" placeholder="Link (Drive/PDF)" value="${link}">
                <input type="file" accept="application/pdf" style="display:none" onchange="uploadPdf(this)">
                <button type="button" class="btn-pdf" onclick="this.previousElementSibling.click()">📁 Tải PDF</button>
                <button type="button" class="btn-del" onclick="this.parentElement.remove()">✕</button>
            `;
            container.appendChild(row);
        }

        function uploadPdf(fileInput) {
            const file = fileInput.files[0];
            if (file) {
                if (file.size > 3 * 1024 * 1024) {
                    alert('File PDF lớn hơn 3MB! Vui lòng dùng đường link Google Drive để tránh làm đầy bộ nhớ.');
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    fileInput.parentElement.querySelector('.link-input').value = e.target.result;
                    alert("Tải file PDF thành công! Nhớ bấm 'Lưu thay đổi'.");
                };
                reader.readAsDataURL(file);
            }
        }

        async function saveData() {
            if (!checkCanEdit()) {
                alert("Tài khoản của bạn không có quyền thực hiện thao tác này!");
                return;
            }

            const rows = document.querySelectorAll('#modalRowContainer .edit-row');
            const updateData = [];

            rows.forEach(row => {
                const inputs = row.querySelectorAll('input[type="text"]');
                const title = inputs[0].value.trim();
                const lang = inputs[1].value.trim();
                const link = inputs[2].value.trim() || '#';

                if (title) {
                    updateData.push({ title, lang, link });
                }
            });

            const btnSave = document.getElementById('btnSave');
            btnSave.disabled = true;
            btnSave.innerText = 'Đang lưu...';

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'updateSheet',
                        sheetName: SHEET_NAME,
                        data: updateData
                    })
                });

                const result = await res.json();
                if (result.status === 'success') {
                    alert('Đã cập nhật danh sách vào Google Sheet thành công!');
                    closeModal();
                    loadFinishingDocsData();
                } else {
                    alert('Lưu thất bại: ' + (result.message || 'Có lỗi xảy ra!'));
                }
            } catch (e) {
                console.error(e);
                alert("Lỗi khi kết nối với server Google Sheet!");
            } finally {
                btnSave.disabled = false;
                btnSave.innerText = 'Lưu thay đổi';
            }
        }

        // Kiểm tra phân quyền giao diện & tải dữ liệu ban đầu
        applyPermissionUI();
        loadFinishingDocsData();
    </script>
</body>
</html>
