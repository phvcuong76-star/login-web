<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groupware Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            width: 420px;
            border: 1px solid #e2e2e2;
            padding: 50px 40px;
            text-align: center;
            background: #ffffff;
        }
        .logo { width: 180px; margin-bottom: 35px; }
        .error-msg {
            background-color: #333333;
            color: white;
            padding: 10px 12px;
            font-size: 13px;
            text-align: left;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        .error-msg .icon {
            background: #d9534f;
            color: white;
            font-weight: bold;
            width: 18px;
            height: 18px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            border-radius: 2px;
            margin-right: 10px;
            font-size: 12px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #00a0e9;
            background-color: #e8f0fe;
            outline: none;
            font-size: 14px;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #0099bc;
            color: white;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn-login:hover { background-color: #0088a8; }
        .remember-me {
            text-align: left;
            margin-top: 15px;
            font-size: 13px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <!-- Thay link ảnh Logo của bạn vào đây -->
    <img src="QA APPROVED.png" class="logo" alt="Logo">
    
    <!-- Khối báo lỗi -->
    <div class="error-msg" id="errorBlock" style="display: none;">
        <span class="icon">!</span> <span id="errorText">Thông tin đăng nhập không chính xác.</span>
    </div>

    <form id="loginForm" onsubmit="return handleLogin(event)">
        <input type="text" id="username" placeholder="Mã người dùng" required>
        <input type="password" id="password" placeholder="Mật khẩu" required>
        <button type="submit" class="btn-login">Đăng nhập</button>
        <div class="remember-me">
            <input type="checkbox" id="remember">
            <label for="remember">Ghi nhớ tài khoản</label>
        </div>
    </form>
</div>

<script>
    function handleLogin(e) {
        e.preventDefault();
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        
        // Thử nghiệm kiểm tra tài khoản đơn giản
        if(u === "phvcuong" && p === "123456") {
            alert("Đăng nhập thành công!");
            window.location.href = "https://google.com"; //
        } else {
            document.getElementById('errorBlock').style.display = 'flex';
        }
    }
</script>

</body>
</html>
