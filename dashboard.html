    <script>

                window.location.replace("index.html");

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            padding: 20px 15px;
            margin: 0;
            top: 0 !important;
            position: relative;
        }

        /* BANNER HAI BÊN */
        .side-banner {
            position: fixed;
            top: 40px;
            width: 180px;
            height: calc(100vh - 80px);
            z-index: -1;
            pointer-events: none;
        }
        .banner-left { left: 15px; }
        .banner-right { right: 15px; }

        .side-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            opacity: 0.85;
        }

        /* KHUNG NỘI DUNG CHÍNH */
        .main-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .company-logo {
            height: 70px;
            width: auto;
            object-fit: contain;
        }

        .header-right-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* WIDGET THỜI TIẾT & NGÀY THÁNG */
        .weather-date-widget {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
            font-size: 13px;
        }

        .weather-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .location-select {
            border: none;
            background: transparent;
            font-weight: 600;
            color: #1e293b;
            cursor: pointer;
            outline: none;
            font-size: 13px;
        }

        .weather-detail {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .weather-icon {
            font-size: 16px;
            line-height: 1;
        }

        .temp {
            font-weight: 700;
            color: #2563eb;
        }

        .widget-divider {
            width: 1px;
            height: 14px;
            background-color: #cbd5e1;
        }

        .date-info {
            color: #475569;
            font-weight: 500;
            white-space: nowrap;
        }

        /* NÚT ĐĂNG XUẤT */
        .btn-logout {
            background-color: #dc2626;
            color: #ffffff;
            border: none;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-logout:hover {
            background-color: #b91c1c;
        }

            font-weight: bold;
            margin-bottom: 10px;
            font-size: 14px;
            background-color: #e0e7ff;
            padding: 8px;
            border-radius: 20px;
            max-width: 580px;
            margin: 0 auto 10px auto;
            border: 1px solid #c7d2fe;

        }

            color: #92400e;
            margin: 0;
            white-space: nowrap;
        }
