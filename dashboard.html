    // --- SỬA LỖI ĐỊNH DẠNG NGÀY THÁNG DD/MM/YYYY ---
    function formatDate(dateString) {
        if (!dateString) return '';
        if (typeof dateString === 'string' && dateString.includes('/')) return dateString;
        
        const d = new Date(dateString);
        if (isNaN(d.getTime())) return dateString;
        
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear();
        
        return `${day}/${month}/${year}`;
    }

    // --- HÀM MỞ FILE CHUNG ---
    function openDocument(url) {
        if (!url || url === '#' || url === '-') return;
        if (url.startsWith('data:application/pdf')) {
            try {
                const arr = url.split(',');
                const mime = arr[0].match(/:(.*?);/)[1];
                const bstr = atob(arr[1]);
                let n = bstr.length;
                const u8arr = new Uint8Array(n);
                while (n--) {
                    u8arr[n] = bstr.charCodeAt(n);
                }
                const blob = new Blob([u8arr], { type: mime });
                const blobUrl = URL.createObjectURL(blob);
                window.open(blobUrl, '_blank');
            } catch (e) {
                alert("Không thể mở file PDF này. File có thể bị hỏng!");
            }
            return;
        }

        const isInternalPage = url.endsWith('.html') || (!url.startsWith('http://') && !url.startsWith('https://'));
        if (isInternalPage) {
            window.location.href = url;
        } else {
            window.open(url, '_blank');
        }
    }

                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'updateSheet',
                    sheetName: sheetName,
                    data: data
                })

        } catch (e) {
            console.error(e);

        }

    // === HÀM TẢI PDF LÊN GOOGLE DRIVE TRỰC TIẾP ===
    function handlePdfUpload(fileInput) {
        const file = fileInput.files[0];
        if (!file) return;

        if (file.type !== 'application/pdf') {
            alert('Vui lòng chọn tệp định dạng .PDF!');
            return;
        }

        if (file.size > 5 * 1024 * 1024) {
            alert('Kích thước file PDF quá lớn (vượt 5MB). Vui lòng giảm dung lượng trước khi tải lên!');
            return;
        }

        const parentRow = fileInput.parentElement;
        const linkInput = parentRow.querySelector('.link-input');
        const btnUpload = parentRow.querySelector('.btn-pdf-upload');

        const originalBtnText = btnUpload.innerText;
        btnUpload.innerText = "⏳ Đang tải...";
        btnUpload.disabled = true;

        const reader = new FileReader();
        reader.onload = function(e) {
            const base64Data = e.target.result;

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'uploadPdf',
                    fileName: file.name,
                    mimeType: file.type,
                    fileData: base64Data
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    linkInput.value = data.fileUrl;
                    alert('Tải file lên Google Drive thành công!');
                } else {
                    alert('Lỗi upload: ' + (data.message || 'Không thể upload'));
                }
            })
            .catch(err => {
                alert('Lỗi kết nối khi tải file lên Drive!');
                console.error(err);
            })
            .finally(() => {
                btnUpload.innerText = originalBtnText;
                btnUpload.disabled = false;
            });
        };
        reader.readAsDataURL(file);
    }

            <input type="text" class="link-input" placeholder="Link hoặc upload PDF" value="${docLink}">
            <input type="file" class="pdf-file-input" accept="application/pdf" style="display: none;" onchange="handlePdfUpload(this)">
            <button type="button" class="btn-pdf-upload" onclick="triggerFileInput(this)">📄 PDF</button>
            <button class="btn-delete-row" onclick="this.parentElement.remove()">✕</button>
        `;
        container.appendChild(rowDiv);
    }

    function saveAuditTable() {
        const container = document.getElementById('modalRowContainer');
        const editRows = container.querySelectorAll('.edit-row-audit');
        const newData = [];

        editRows.forEach((row) => {
            const inputs = row.querySelectorAll('input');
            const customer = inputs[0].value.trim();
            const date = inputs[1].value.trim();
            const type = inputs[2].value.trim();
            const factory = inputs[3].value.trim();
            const docLink = inputs[4].value.trim();

            if (customer || date || type || factory || docLink) {
                newData.push({ customer, date, type, factory, docLink });
            }
        });

        globalData.audit = newData;
        saveToGoogleSheet('audit', newData, closeEditModal);
    }

    window.addEventListener('DOMContentLoaded', () => {
        loadAllDataFromGoogleSheet();
    });

    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'vi',
            includedLanguages: 'en,ko,vi',
            autoDisplay: false
        }, 'google_translate_element');
    }

    function translatePage(langCode, btn) {
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        var selectObj = document.querySelector('.goog-te-combo');
        if (selectObj) {
            selectObj.value = langCode;
            selectObj.dispatchEvent(new Event('change'));
        }
    }
</script>
